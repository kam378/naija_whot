<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="opponent">
      <div class="opponent-cards" id="opponent"> 
      </div>
      <div class="more" id="more">
        +5
      </div>
    </div>
    <div class="belt">
      <div class="market">
        <div class="market-slot">
          <div class="card-back" id="market"></div>
        </div>
      </div>
      <div class="stack">
        <div class="market-slot" id="played">
          <div class="card">
            <div class="top-number">5</div>
            <div class="shape">
              <div class="hollow"></div>
            </div>
            <div class="bottom-number">5</div>
          </div>
        </div>
      </div>
    </div>
    <div class="player" id="player">
      <div class="card">
        <div class="top-number">5</div>
        <div class="shape">
          <div class="hollow"></div>
        </div>
        <div class="bottom-number">5</div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
